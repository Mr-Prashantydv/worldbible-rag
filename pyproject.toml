[project]
name = "worldbible-rag"
version = "0.1.0"
description = "Ask questions of a story world bible: hybrid retrieval, grounded answers with checked citations, and a retrieval eval."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.115",
    "fastembed>=0.7",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
worldbible = "worldbible_rag.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
